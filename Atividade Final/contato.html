        <h1>Contato</h1>
        <p>Você pode falar comigo pelo <a href="https://www.linkedin.com/in/mitsuo-nakamura-283b36386/" target="_blank">LinkedIn</a>, pelo e-mail <a href="mailto:mitsuo.nakamura@edu.unifil.br">mitsuo.nakamura@edu.unifil.br</a> ou mandar uma mensagem por aqui:</p>

        <form id="formulario" onsubmit="enviarMensagem(event)">
            <fieldset>
                <legend>Envie uma mensagem</legend>

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required minlength="3">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea>

                <button type="submit">Enviar</button>
            </fieldset>
        </form>

        <p id="resposta"></p>
